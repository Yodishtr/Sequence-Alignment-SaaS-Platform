name: Alignment Sequence Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo code
        uses: actions/checkout@v4

      - name: setup the jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'openjdk'
          java-version: '21'
          cache: maven

      - name: maven dependency caching
        run: chmod +x mvnw

      - name: Build and test with Maven
        run: ./mvnw verify
